apiVersion: apps/v1
kind: Deployment
metadata: { name: citadel-api, labels: { app: citadel-api } }
spec:
  replicas: 2
  selector: { matchLabels: { app: citadel-api } }
  template:
    metadata: { labels: { app: citadel-api } }
    spec:
      containers:
        - name: api
          image: ghcr.io/maxferreira01/citadelp/api:latest
          ports: [{ containerPort: 8000 }]
          envFrom: [{ secretRef: { name: citadel-env } }]
          readinessProbe: { httpGet: { path: /healthz, port: 8000 } }
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { memory: 512Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: citadel-api }
spec:
  selector: { app: citadel-api }
  ports: [{ port: 80, targetPort: 8000 }]
