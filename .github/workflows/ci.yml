name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets-scan:
    name: gitleaks · caça a segredos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  changes:
    name: detectar mudanças por área
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'collectors/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

  backend:
    name: backend · ruff + pytest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: instalar
        run: pip install -e "backend[dev]"
      - name: lint (ruff check + format)
        run: |
          ruff check backend
          ruff format --check backend
      - name: testes
        run: pytest backend -q --tb=short

  frontend:
    name: frontend · build vite
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: instalar e buildar
        working-directory: frontend
        run: |
          npm ci
          npm run build

  ci-ok:
    name: CI ok (gate p/ branch protection)
    if: always()
    needs: [secrets-scan, backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: verificar resultados
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "resultados: $results"
          for r in $results; do
            [ "$r" = "success" ] || [ "$r" = "skipped" ] || exit 1
          done
