[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "citadel-backend"
version = "0.1.0"
description = "CITADEL — API da plataforma de infraestrutura (TOTVS Cloud)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111",
  "google-auth>=2.30",
  "httpx>=0.27",
  "requests>=2.32",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["ruff>=0.5", "pytest>=8", "jinja2>=3.1"]
# Corvo · Datadog: bot Socket Mode e relatório PDF (opcionais; a imagem da API não os leva)
bot = ["slack-sdk>=3.27", "slack-bolt>=1.20"]
report = ["jinja2>=3.1", "weasyprint>=62"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["corvo/templates/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
