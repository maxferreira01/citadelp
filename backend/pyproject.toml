[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "citadel-backend"
version = "0.1.0"
description = "CITADEL — API da plataforma de infraestrutura (TOTVS Cloud)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111",
  "httpx>=0.27",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["ruff>=0.5", "pytest>=8"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
