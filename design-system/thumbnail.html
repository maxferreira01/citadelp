<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>CITADEL</title>
<link rel="stylesheet" href="styles.css">
<style>*{margin:0;padding:0;box-sizing:border-box}body{width:1280px;height:854px;display:grid;grid-template-columns:1fr 200px}
.main{background:#002233;display:flex;align-items:center;justify-content:center}
.main span{font:700 150px/1 'TOTVS','Archivo',sans-serif;letter-spacing:.02em;color:#FFFFFF}
.strip{display:grid;grid-template-rows:1fr 1fr 1fr 1fr}
.strip i{display:block}</style></head>
<body>
<div class="main"><span>CITADEL</span></div>
<div class="strip"><i style="background:#7FC7E8"></i><i style="background:#E0A34E"></i><i style="background:#B4690E"></i><i style="background:#0F5E8C"></i></div>
</body></html>
