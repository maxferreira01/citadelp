<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;padding:16px 20px;background:var(--surface);color:var(--ink);font-family:var(--font-ui)}
.r{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:baseline;border-bottom:1px solid var(--hairline);padding:7px 0}
.l{font:500 10px var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}</style></head><body>
<div class="r"><span class="l">h3 · 16 semibold</span><span style="font:600 16px var(--font-ui)">Runways por recurso</span></div>
<div class="r"><span class="l">body · 13,5</span><span style="font-size:13.5px">NSX T1 pode atingir o limite operacional em 38 dias.</span></div>
<div class="r"><span class="l">sm · 12,5</span><span style="font-size:12.5px;color:var(--text-muted)">Esta previsão utiliza 12 meses de histórico e possui 84% de confiança.</span></div>
<div class="r"><span class="l">caption caps</span><span style="font:600 10.5px var(--font-ui);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-muted)">cenários &amp; eventos</span></div>
<div class="r" style="border:0"><span class="l">hero · expandida</span><span style="font:700 34px/1 var(--font-ui);font-stretch:124%">38 <span style="font-size:16px">dias</span></span></div>
</body></html>
