<!-- @dsCard group="Colors" viewport="700x170" name="Capacidade" subtitle="Disponível, reservada, consumida, projetada + limites operacional e técnico" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;padding:16px;font-family:var(--font-mono);background:var(--surface)}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:10px;color:var(--text-muted);margin-top:12px}
.leg i{font-style:normal;display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:5px}</style></head><body>
<svg width="100%" height="64" viewBox="0 0 660 64" preserveAspectRatio="none">
<rect x="0" y="20" width="660" height="18" rx="9" fill="var(--cap-available)"/>
<rect x="0" y="20" width="470" height="18" rx="9" fill="var(--cap-consumed)"/>
<rect x="470" y="20" width="60" height="18" fill="var(--cap-reserved)"/>
<rect x="530" y="20" width="70" height="18" fill="var(--cap-projected)"/>
<line x1="612" y1="8" x2="612" y2="50" stroke="var(--cap-limit-op)" stroke-width="2.5" stroke-dasharray="4 3"/>
<line x1="658" y1="8" x2="658" y2="50" stroke="var(--cap-limit-tech)" stroke-width="3"/>
</svg>
<div class="leg"><span><i style="background:var(--cap-consumed)"></i>consumida</span><span><i style="background:var(--cap-reserved)"></i>reservada</span><span><i style="background:var(--cap-projected)"></i>projetada</span><span><i style="background:var(--cap-available)"></i>disponível</span><span><i style="background:var(--cap-limit-op)"></i>limite operacional</span><span><i style="background:var(--cap-limit-tech)"></i>limite técnico</span></div>
</body></html>
