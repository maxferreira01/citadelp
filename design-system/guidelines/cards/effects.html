<!-- @dsCard group="Spacing" viewport="700x170" name="Raios, foco e elevação" subtitle="Sombra só em overlay; foco 2px petróleo; raio 4/6/10" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;padding:18px 20px;background:var(--bg-page);display:flex;gap:14px;align-items:center;font-family:var(--font-mono)}
.bx{width:118px;height:64px;background:var(--surface);border:1px solid var(--hairline);display:flex;align-items:center;justify-content:center;font-size:9.5px;color:var(--text-muted);text-align:center}</style></head><body>
<div class="bx" style="border-radius:var(--radius-sm)">radius-sm 4</div>
<div class="bx" style="border-radius:var(--radius-md)">radius-md 6</div>
<div class="bx" style="border-radius:var(--radius-lg)">radius-lg 10</div>
<div class="bx" style="border-radius:var(--radius-md);outline:var(--focus-outline);outline-offset:var(--focus-offset)">foco visível</div>
<div class="bx" style="border-radius:var(--radius-md);box-shadow:var(--shadow-overlay);border:0">overlay</div>
</body></html>
