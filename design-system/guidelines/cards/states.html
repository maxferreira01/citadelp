<!-- @dsCard group="Colors" viewport="700x290" name="Estados semânticos" subtitle="Glifo + cor + texto — nunca só cor; desconhecido também é estado" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;padding:14px;font-family:var(--font-ui);background:var(--bg-page)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.s{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--hairline);border-radius:var(--radius-md);padding:8px 11px;font-size:12px;color:var(--ink)}
.s i{font-style:normal;width:20px;text-align:center;font-family:var(--font-mono);font-size:13px}
.s small{color:var(--text-muted);font-size:10.5px;margin-left:auto;font-family:var(--font-mono)}
.dash{border-style:dashed}.dot{border-style:dotted}</style></head><body>
<div class="g">
<div class="s"><i style="color:var(--state-info)">ℹ</i>Informativo<small>--state-info</small></div>
<div class="s"><i style="color:var(--state-ok)">●</i>Saudável<small>--state-ok</small></div>
<div class="s"><i style="color:var(--state-warn)">◆</i>Atenção<small>--state-warn</small></div>
<div class="s"><i style="color:var(--state-crit)">▲</i>Crítico<small>--state-crit</small></div>
<div class="s"><i style="color:var(--state-emergency)">▲▲</i>Emergência<small>--state-emergency</small></div>
<div class="s dash"><i style="color:var(--state-unknown)">?</i>Desconhecido<small>--state-unknown</small></div>
<div class="s"><i style="color:var(--state-unavailable)">⊘</i>Indisponível<small>--state-unavailable</small></div>
<div class="s dot"><i style="color:var(--state-nocollect)">◌</i>Sem coleta<small>--state-nocollect</small></div>
<div class="s dash"><i style="color:var(--state-stale)">◐</i>Desatualizado<small>--state-stale</small></div>
<div class="s dash"><i style="color:var(--state-divergent)">≠</i>Divergente<small>--state-divergent</small></div>
</div>
</body></html>
