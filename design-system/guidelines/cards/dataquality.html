<!-- @dsCard group="Colors" viewport="700x180" name="Qualidade do dado" subtitle="Método de obtenção sempre visível: observado, calculado, estimado, manual…" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;padding:14px;font-family:var(--font-mono);background:var(--bg-page);display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.q{display:inline-flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--hairline);border-radius:var(--radius-sm);padding:5px 10px;font-size:11px;color:var(--ink)}
.q b{font-weight:700;letter-spacing:.08em}</style></head><body>
<span class="q"><b style="color:var(--dq-observed)">OBS</b>observado · coletor/API</span>
<span class="q"><b style="color:var(--dq-calculated)">CALC</b>calculado · derivado de série</span>
<span class="q"><b style="color:var(--dq-estimated)">EST</b>estimado · forecast/projeção</span>
<span class="q"><b style="color:var(--dq-manual)">MAN</b>manual · cadastro humano</span>
<span class="q" style="border-style:dashed"><b style="color:var(--dq-stale)">◐</b>desatualizado · idade &gt; SLA do dado</span>
<span class="q" style="border-style:dashed"><b style="color:var(--dq-divergent)">≠</b>divergente · fontes discordam</span>
<span class="q" style="border-style:dotted"><b style="color:var(--dq-noorigin)">?</b>sem origem identificada</span>
</body></html>
